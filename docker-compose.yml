services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialx-backend
    ports:
      - "${BACKEND_PORT:-3001}:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: socialx-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"